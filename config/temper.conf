# --- GESTIONE ENERGIA & REATTIVITÀ ---
# Disabilita il Deep Sleep per risposta istantanea al wakeup
CONFIG_ZMK_SLEEP=n

# --- POTENZA E PRESTAZIONI BLE ---
# Potenza di trasmissione massima (+8dBm) per stabilità tra le metà e il Dongle
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Risolve problemi di riconnessione/stabilità BLE (Sostituisce il vecchio EXPERIMENTAL_FEATURES)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 2M PHY per maggiore velocità di trasmissione e minore latenza
CONFIG_BT_CTLR_PHY_2M=y

# ATTENZIONE: Questo DEVE rimanere abilitato ('y') per il corretto funzionamento dello split!
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# --- MODULI AGGIUNTIVI ---
# Supporto per Mouse/Pointing device
CONFIG_ZMK_POINTING=y

# Impostazioni Display Prospector
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
